# ===============================
# Database Configuration (PostgreSQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-dark-lake-b3emihul-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/edlearndb?sslmode=require&currentSchema=edlearn&socketFactory=com.edlearn.backend.config.NeonSocketFactory}
